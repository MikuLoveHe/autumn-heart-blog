<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章阅读 - 秋心之云</title>
    <link rel="icon" type="image/png" href="logo.jpg">
    <link href="/css/fonts.css" rel="stylesheet">
    <link href="https://unpkg.com/phosphor-icons@1.4.2/src/css/icons.css" rel="stylesheet">

    <script src="js/axios.min.js"></script>
    <style>
        :root {
            --primary-color: #39b5cc;
            --secondary-color: #E8A83A;
            --light-color: #FAF4E9;
            --text-dark: #333;
            --text-light: #fff;
            --card-bg: rgba(202, 201, 132, 0.2);
            --shadow: 0 8px 32px rgba(31, 43, 72, 0.15);
            --border-radius: 16px;
            --transition: all 0.5s ease;
        }

        body.dark-mode {
            --card-bg: rgb(103, 97, 129);
            --text-dark: #eee;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            background-color: #1c212c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #39b5cc 0%, #e8a83a 100%);
            color: var(--text-dark);
            min-height: 100vh;
            transition: var(--transition);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        /* 顶部导航 */
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 32px;
            backdrop-filter: blur(12px);
            padding: 16px;
            border-radius: var(--border-radius);
            background: var(--card-bg);
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .logo {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            object-fit: cover;
            margin-right: 16px;
        }

        .site-name {
            font-size: 24px;
            font-weight: bold;
            color: white;
        }

        .dark-mode-toggle {
            margin-left: auto;
            background: none;
            border: none;
            color: var(--text-dark);
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 8px;
            border-radius: 8px;
            transition: var(--transition);
        }

        .dark-mode-toggle:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* 主体内容布局 */
        .article-container {
            display: flex;
            gap: 24px;
        }

        /* 文章摘录侧边栏 */
        .excerpt-sidebar {
            width: 280px;
            padding: 24px;
            backdrop-filter: blur(12px);
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.18);
            align-self: flex-start;
            position: sticky;
            top: 24px;
        }

        .excerpt-title {
            font-size: 18px;
            margin-bottom: 16px;
            color: white;
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 8px;
        }

        .excerpt-content {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-dark);
        }

        /* 文章主要内容 */
        .article-content {
            flex: 1;
            backdrop-filter: blur(12px);
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 32px;
        }

        .article-header {
            margin-bottom: 24px;
        }

        .article-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 16px;
            color: white;
        }

        .article-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
            font-size: 14px;
            color: var(--text-dark);
            opacity: 0.8;
        }

        .article-image {
            width: 100%;
            height: auto;
            border-radius: var(--border-radius);
            margin-bottom: 24px;
            transition: transform 0.3s ease;
            aspect-ratio: 3/2;
            object-fit: cover;
        }

        .article-image:hover {
            transform: scale(1.05);
        }

        .article-body {
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 32px;
            white-space: pre-line;
        }

        .article-body p {
            margin-bottom: 16px;
        }

        .tag {
            position: relative;
            margin-left: 4px;
            padding: 2px 6px;
            background: var(--primary-color);
            border-radius: 4px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tag:hover {
            background: var(--secondary-color);
            color: white;
            transform: translateY(-2px);
        }

        .tag-tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary-color);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            margin-bottom: 5px;
            opacity: 0.9;
        }

        .tag-tooltip:after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px;
            border-style: solid;
            border-color: var(--primary-color) transparent transparent transparent;
        }

        /* 文章底部信息 */
        .article-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .article-stats {
            display: flex;
            gap: 24px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .action-buttons {
            display: flex;
            gap: 16px;
        }


        /* 未找到文章的样式 */
        .not-found-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .not-found-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 32px;
            text-align: center;
            box-shadow: var(--shadow);
            max-width: 500px;
            width: 100%;
        }

        .not-found-card h2 {
            color: white;
            margin-bottom: 16px;
        }

        .not-found-card p {
            color: var(--text-dark);
            margin-bottom: 24px;
        }

        /* 按钮样式 */
        .btn {
            position: relative;
            overflow: hidden;
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-secondary {
            background-color: var(--secondary-color);
            color: white;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
        }

        .ph-heart-filled {
            color: var(--secondary-color);
        }

        .btn .ripple {
            position: absolute;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.7);
            transform: scale(0);
            animation: ripple 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        .btn:hover .icon {
            transform: translateX(4px);
        }

        .icon {
            transition: transform 0.3s ease;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .article-container {
                flex-direction: column;
            }

            .excerpt-sidebar {
                width: 100%;
                position: static;
            }

            .article-content {
                padding: 24px;
            }

            .article-title {
                font-size: 20px;
            }

            .article-body {
                font-size: 14px;
            }
        }

        /* 页面过渡效果 */
        .page-enter-active, .page-leave-active {
            transition: opacity 0.5s, transform 0.5s;
        }

        .page-enter, .page-leave-to {
            opacity: 0;
            transform: translateY(20px);
        }
    </style>

</head>
<body>
<div id="app">
    <transition name="page">
        <div class="container" v-if="article">
            <!-- 顶部导航 -->
            <header class="header">
                <img src="logo.jpg" alt="秋心之云" class="logo">
                <span class="site-name">秋心之云</span>
                <button class="dark-mode-toggle" @click="toggleDarkMode">
                    <i class="ph" :class="darkMode ? 'ph-sun' : 'ph-moon'"></i>
                    {{ darkMode ? '浅色模式' : '深色模式' }}
                </button>
            </header>

            <!-- 文章内容 -->
            <div class="article-container">
                <!-- 文章摘录侧边栏 -->
                <aside class="excerpt-sidebar">
                    <h3 class="excerpt-title">文章摘录</h3>
                    <p class="excerpt-content">{{ article.articleExcerpt }}</p>
                </aside>

                <!-- 文章主要内容 -->
                <main class="article-content">
                    <div class="article-header">
                        <h1 class="article-title">{{ article.articleTitle }}</h1>
                        <div class="article-meta">
                            <span><i class="ph ph-user"></i> {{ article.author }}</span>
                            <span><i class="ph ph-calendar"></i> {{ article.articleAddTime }}</span>
                            <span class="tags-container">
                            <i class="ph ph-tag"></i>
                            <span v-for="(tag, index) in article.tagsName" :key="index" class="tag"
                                  @mouseover="hoverTag = tag"
                                  @mouseout="hoverTag = null">
                                {{ tag }}<span v-if="index < article.tagsName.length - 1"></span>
                               <span class="tag-tooltip" v-if="hoverTag === tag">{{ tag }}</span>
                           </span>
                       </span>
                        </div>
                    </div>

                    <div v-if="article.articleImgUrl" class="article-image-container">
                        <img :src="article.articleImgUrl"
                             :alt="article.articleTitle"
                             class="article-image"
                             @error="handleImageError">
                    </div>

                    <div class="article-body" v-html="article.articleContext"></div>

                    <div class="article-footer">
                        <div class="article-stats">
                                <span class="stat-item">
                                    <i class="ph ph-eye"></i> {{ article.articleLookNum }} 次阅读
                                </span>
                            <span class="stat-item">
                                    <i class="ph ph-heart" :class="{'filled': isLiked}"></i> {{
                                    article.articleGoodNum
                                }} 点赞
                                </span>
                        </div>
                        <div class="action-buttons">
                            <button class="btn"
                                    :class="isLiked ? 'btn-secondary' : 'btn-primary'"
                                    @click="toggleLike"
                                    v-ripple>
                                <i class="ph" :class="isLiked ? 'ph-heart-fill' : 'ph-heart'"></i>
                                {{ isLiked ? '已点赞' : '点赞' }}
                            </button>
                            <button class="btn btn-outline" @click="goBack" v-ripple>
                                <i class="ph ph-arrow-left icon"></i> 返回
                            </button>
                        </div>
                    </div>
                </main>
            </div>
        </div>
        <div v-else-if="articleNotFound" class="not-found-container">
            <div class="not-found-card">
                <h2>该文章不存在</h2>
                <p>您访问的文章可能已被删除或不存在</p>
                <button class="btn btn-primary" @click="goBack" v-ripple>
                    <i class="ph ph-arrow-left icon"></i> 返回
                </button>
            </div>
        </div>
        <div v-else class="loading-container">
            <p>加载中...</p>
        </div>
    </transition>
</div>

<script src="js/vue.min.js"></script>

<script>
    // 波纹指令
    Vue.directive('ripple', {
        bind: function (el, binding) {
            el.addEventListener('click', function (e) {
                const ripple = document.createElement('span');
                ripple.classList.add('ripple');

                const rect = el.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                const x = e.clientX - rect.left - size / 2;
                const y = e.clientY - rect.top - size / 2;

                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';

                el.appendChild(ripple);

                setTimeout(() => {
                    ripple.remove();
                }, 600);
            });
        }
    });

    new Vue({
        el: '#app',
        data: {
            article: null,
            loading: true,
            darkMode: false,
            articleId: null,
            isLiked: false,
            hoverTag: null,
            articleNotFound: false
        },
        created() {
            // 从URL获取文章ID
            this.articleId = this.getArticleIdFromUrl();
            this.fetchArticle();

            this.checkDarkModePreference();
            // 从本地存储检查是否已经点赞过
            this.checkLikeStatus();
        },
        methods: {
            getArticleIdFromUrl() {
                // 从URL参数获取文章ID并加载数据
                const articleId = new URLSearchParams(window.location.search).get('id');
                console.log(articleId)
                return articleId; // 示例ID
            },
            handleImageError(e) {
                // 图片加载失败时移除图片容器
                e.target.parentNode.remove();
            },
            //获得文章
            fetchArticle() {

                axios.get('/articles/' + this.articleId)
                    .then(response => {
                        console.log("返回的数据：", response.data)
                        console.log(response.data)
                        if (response.data) {
                            this.article = response.data
                            console.log("返回的数据：", response.data)
                        } else {
                            console.log("没有文章内容")
                            this.articleNotFound = true
                            console.log(this.articleNotFound)
                        }
                        this.loading = false;

                    })
                    .catch(error => {
                        console.error('Error fetching article:', error);
                        this.articleNotFound = true
                        this.loading = false;
                    });

            },
            //获得点赞数
            async fetchArticleGoodNum() {

                await axios.get('/articles/' + this.article.articleId + '/like').then(
                    resp => {
                        this.article.articleGoodNum = resp.data
                        console.log('获得点赞数');
                        console.log(resp.data)
                    }
                )
            },
            checkLikeStatus() {
                // 从本地存储检查是否已经点赞过
                const likedArticles = JSON.parse(localStorage.getItem('likedArticles') || '{}');
                this.isLiked = likedArticles[this.articleId] || false;
            },

            async toggleLike() {
                console.log('点赞');
                if (this.isLiked) {
                    // 取消点赞
                    console.log('取消点赞');
                    await axios.delete('/articles/' + this.article.articleId + '/like')
                } else {
                    // 点赞
                    console.log('已点赞');
                    await axios.post('/articles/' + this.article.articleId + '/like')
                }

                // 切换点赞状态
                this.isLiked = !this.isLiked;

                await this.fetchArticleGoodNum()

                // 更新本地存储
                const likedArticles = JSON.parse(localStorage.getItem('likedArticles') || '{}');
                likedArticles[this.article.articleId] = this.isLiked;
                localStorage.setItem('likedArticles', JSON.stringify(likedArticles));
            },
            formatDate(dateString) {
                const options = {year: 'numeric', month: 'long', day: 'numeric'};
                return new Date(dateString).toLocaleDateString('zh-CN', options);
            },
            goBack() {
                window.history.back();
            },
            toggleDarkMode() {
                this.darkMode = !this.darkMode;
                if (this.darkMode) {
                    document.body.classList.add('dark-mode');
                    localStorage.setItem('darkMode', 'enabled');
                } else {
                    document.body.classList.remove('dark-mode');
                    localStorage.setItem('darkMode', 'disabled');
                }
            },
            checkDarkModePreference() {
                if (localStorage.getItem('darkMode') === 'enabled' ||
                    (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    this.darkMode = true;
                    document.body.classList.add('dark-mode');
                }
            }
        }
    });
</script>
</body>
</html>
